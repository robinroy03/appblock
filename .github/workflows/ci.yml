name: CI

# Branch pushes only: a bare `push:` also fires on tags, so publishing a
# release re-ran CI on a commit that had already passed. Docs-only changes
# (README, screenshots, licence, issue templates) can't break the app, so
# they don't run CI at all.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "public/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "public/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"

# A newer push to the same branch cancels the run it makes outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Caches Gradle and its downloads between runs (like caching node_modules).
      - uses: gradle/actions/setup-gradle@v4
      # Runs the unit tests and makes sure the APK still compiles.
      - run: ./gradlew test assembleDebug

  # End-to-end tests (app/src/androidTest): the real app on an Android 14
  # emulator, driven by UI Automator. Same suite as scripts/e2e.sh locally.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Hardware acceleration: GitHub's Linux runners support KVM, but the
      # runner user needs access to the device.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A fresh emulator, cold-booted every run. No cached snapshot: booting
      # one days old jumps the clock by days, and Android's usage-stats
      # service can come out of that jump recording no app switches at all,
      # so the blocker (which reads them) never sees the blocked app open.
      - name: Run the e2e tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      # Which test failed and why (HTML report), plus a screenshot of the
      # screen at the moment each failing test failed and the device log.
      - name: Upload the e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/connected_android_test_additional_output/
